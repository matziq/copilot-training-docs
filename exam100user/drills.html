<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Drills &mdash; AB-100 Prep</title>
<meta name="description" content="Ten short timed AB-100 drills, one per skills-outline objective, with instant scoring and explanations.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar"></header>

<main id="main"><div class="wrap">
    <div id="head">
        <h1>Topic Drills</h1>
        <p class="lede">One objective, eight questions, about ten minutes. Use these between practice exams to fix
            something specific.</p>
    </div>
    <div id="list"></div>
    <div id="app"></div>
</div></main>

<footer id="footer"></footer>

<script src="assets/data/drills.js"></script>
<script src="assets/test-engine.js"></script>
<script>
(function () {
    function param(k) {
        var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : null;
    }
    var ICON = { plan: "teal", design: "amber", deploy: "bad" };

    document.addEventListener("DOMContentLoaded", function () {
        var sets = (window.AP_DATA && window.AP_DATA.drills) || [];
        var want = param("set");
        if (want) {
            var found = null;
            for (var i = 0; i < sets.length; i++) if (sets[i].id === want) found = sets[i];
            if (found) {
                document.getElementById("head").innerHTML =
                    '<p class="no-print"><a href="drills.html">&larr; All drills</a></p>' +
                    "<h1>" + found.title + "</h1>" + '<p class="lede">' + (found.blurb || "") + "</p>";
                AP.Test.mountDrill({ el: document.getElementById("app"), drillId: want });
                return;
            }
            AP.toast("That drill was not found.");
        }

        if (!sets.length) {
            document.getElementById("list").innerHTML = '<div class="card"><h3>Drills did not load</h3>' +
                "<p>The drill data file could not be read. Refresh the page.</p></div>";
            return;
        }

        var scores = AP.store.get("drillScores", {});
        var domains = AP.outline().domains, html = "", totalQ = 0;
        for (var d = 0; d < domains.length; d++) {
            var dom = domains[d], body = "";
            for (var s = 0; s < sets.length; s++) {
                var set = sets[s];
                if (set.domain !== dom.name) continue;
                var qn = set.questions.length, prev = scores[set.id];
                totalQ += qn;
                var badge = prev ? ' <span class="badge ' + (prev.pct >= 85 ? "good" : (prev.pct >= 60 ? "amber" : "bad")) +
                    '">Best ' + prev.right + "/" + prev.total + "</span>" : "";
                body += '<a class="card card-link" href="drills.html?set=' + set.id + '">' +
                    '<div class="card-icon ' + ICON[dom.id] + '">' + (set.objective || qn) + "</div>" +
                    "<h3>" + set.title + badge + "</h3><p>" + (set.blurb || "") + "</p>" +
                    '<p class="faint" style="margin-bottom:0"><small>' + qn + " questions &middot; " +
                    (set.timeMinutes || 10) + " minutes</small></p></a>";
            }
            if (!body) continue;
            html += '<div class="week-head"><h2>' + dom.num + ". " + dom.name + "</h2>" +
                '<span class="wgoal">' + dom.weight + "% of the " + AP.outline().label.toLowerCase() +
                ' &middot; <a href="' + dom.href + '">study guide</a></span></div><div class="grid grid-3">' + body + "</div>";
        }

        document.getElementById("list").innerHTML =
            '<div class="callout tip"><span class="callout-title">How to use a drill</span>' +
            "<p>Do the whole set on the clock without checking anything. Then read the explanation for every question, " +
            "including the ones you got right.</p>" +
            '<p style="margin-bottom:0">Log misses in the <a href="tools.html#errorlog">error log</a> and re-drill that set two days later.</p></div>' +
            '<p class="muted">' + sets.length + " drill sets &middot; " + totalQ + " questions.</p>" + html;
    });
})();
</script>
</body>
</html>
