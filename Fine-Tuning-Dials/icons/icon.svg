<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#12161d" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <radialGradient id="bezel" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#8a919c" />
      <stop offset="55%" stop-color="#4a4f57" />
      <stop offset="100%" stop-color="#1c1f24" />
    </radialGradient>
    <radialGradient id="face" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#333740" />
      <stop offset="100%" stop-color="#15171b" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />

  <!-- Outer bezel -->
  <circle cx="256" cy="256" r="204" fill="url(#bezel)" />

  <!-- Inner face -->
  <circle cx="256" cy="256" r="168" fill="url(#face)" stroke="#05070a" stroke-width="4" />

  <!-- Tick marks across a 270 degree sweep -->
  <g stroke="#9aa4b2" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(-135 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(-90 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(-45 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(0 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(45 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(90 256 256)" />
    <line x1="256" y1="106" x2="256" y2="126" transform="rotate(135 256 256)" />
  </g>

  <!-- Observed reference tick (green), at 12 o'clock -->
  <line x1="256" y1="100" x2="256" y2="128" stroke="#3ddc84" stroke-width="7" stroke-linecap="round" />

  <!-- Deviation arc, amber, sweeping from 12 o'clock to the needle position -->
  <path d="M 256 116 A 140 140 0 0 1 358.99 213.01" fill="none" stroke="#ffb454" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- Pointer needle, rotated to about +45 degrees ("turned off observed") -->
  <g transform="rotate(45 256 256)">
    <line x1="256" y1="256" x2="256" y2="130" stroke="#ffb454" stroke-width="13" stroke-linecap="round" />
    <circle cx="256" cy="124" r="12" fill="#4fd8e0" />
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="34" fill="#20242b" stroke="#05070a" stroke-width="4" />
  <circle cx="256" cy="256" r="13" fill="#0b0c0e" />
</svg>
