<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Drills &mdash; Alina&rsquo;s ACT Prep</title>
<meta name="description" content="Short timed ACT drills on one skill at a time, with instant scoring and a full explanation for every question.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar"></header>

<main id="main"><div class="wrap">
    <div id="head">
        <h1>Topic Drills</h1>
        <p class="lede">One skill, eight questions, about ten minutes. This is your weekday tool &mdash; short
            enough to actually do, specific enough to actually fix something.</p>
    </div>
    <div id="list"></div>
    <div id="app"></div>
</div></main>

<footer id="footer"></footer>

<script src="assets/data/drills.js"></script>
<script src="assets/test-engine.js"></script>
<script>
(function () {
    function param(k) {
        var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : null;
    }

    var SECTION_META = {
        Math:    { icon: "bad",   blurb: "Your priority. Math is one third of the composite now and it is the most coachable section on the test." },
        English: { icon: "teal",  blurb: "Already your strongest section. These drills target the rules that separate a 28 from a 32." },
        Reading: { icon: "amber", blurb: "Each of these includes a full passage, so budget the extra few minutes." },
        Science: { icon: "good",  blurb: "Optional on the Enhanced ACT and not part of your composite. Keep these short." }
    };

    function bestFor(id) {
        var runs = ACT.store.get("drillScores", {});
        return runs[id] || null;
    }

    document.addEventListener("DOMContentLoaded", function () {
        var sets = (window.ACT_DATA && window.ACT_DATA.drills) || [];
        var want = param("set");

        if (want) {
            var found = null;
            for (var i = 0; i < sets.length; i++) if (sets[i].id === want) found = sets[i];
            if (found) {
                document.getElementById("head").innerHTML =
                    '<p class="no-print"><a href="drills.html">&larr; All drills</a></p>' +
                    "<h1>" + found.title + "</h1>" +
                    '<p class="lede">' + (found.blurb || "") + "</p>";
                document.getElementById("list").innerHTML = "";
                ACT.Test.mountDrill({ el: document.getElementById("app"), drillId: want });
                return;
            }
            ACT.toast("That drill was not found.");
        }

        // group by section
        var order = ["Math", "English", "Reading", "Science"];
        var bySection = {};
        for (var s = 0; s < sets.length; s++) {
            var sec = sets[s].section || "Other";
            if (!bySection[sec]) bySection[sec] = [];
            bySection[sec].push(sets[s]);
        }

        var html = "";
        var totalQ = 0;
        for (var o = 0; o < order.length; o++) {
            var name = order[o];
            var group = bySection[name];
            if (!group || !group.length) continue;
            var meta = SECTION_META[name] || { icon: "", blurb: "" };

            html += '<div class="week-head"><h2>' + name + "</h2>" +
                '<span class="wgoal">' + meta.blurb + "</span></div>" +
                '<div class="grid grid-3">';

            for (var g = 0; g < group.length; g++) {
                var d = group[g];
                var qn = d.questions.length;
                totalQ += qn;
                var prev = bestFor(d.id);
                var badge = prev
                    ? '<span class="badge ' + (prev.pct >= 85 ? "good" : (prev.pct >= 60 ? "amber" : "bad")) +
                      '">Best ' + prev.right + "/" + prev.total + "</span>"
                    : "";
                html += '<a class="card card-link" href="drills.html?set=' + d.id + '">' +
                    '<div class="card-icon ' + meta.icon + '">' + qn + "</div>" +
                    "<h3>" + d.title + " " + badge + "</h3>" +
                    "<p>" + (d.blurb || "") + "</p>" +
                    '<p class="faint" style="margin-bottom:0"><small>' + qn + " questions &middot; " +
                    (d.timeMinutes || 10) + " minutes" +
                    (d.passageHtml ? " &middot; includes a passage" : "") + "</small></p></a>";
            }
            html += "</div>";
        }

        if (!html) {
            html = '<div class="card"><h3>Drills did not load</h3>' +
                "<p>The drill data file could not be read. Refresh the page.</p></div>";
        } else {
            html = '<div class="callout tip"><span class="callout-title">How to use a drill</span>' +
                "<p style=\"margin-bottom:0\">Do the whole set on the clock without checking anything. Then read the " +
                "explanation for <em>every</em> question, including the ones you got right &mdash; if you guessed " +
                "correctly, you have not learned it yet. Anything you miss goes in the " +
                '<a href="tools.html#errorlog">error log</a>, and you re-drill that set three days later.</p></div>' +
                '<p class="muted">' + sets.length + " drill sets &middot; " + totalQ +
                " questions in total, weighted toward Math.</p>" + html;
        }
        document.getElementById("list").innerHTML = html;
    });
})();
</script>
</body>
</html>
