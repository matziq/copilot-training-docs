<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic Drills &mdash; Brooks&rsquo;s A+ Prep</title>
<meta name="description" content="Sixteen short timed CompTIA A+ drills on one skill at a time, with instant scoring and a full explanation for every question.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar"></header>

<main id="main"><div class="wrap">
    <div id="head">
        <h1>Topic Drills</h1>
        <p class="lede">One skill, eight questions, about ten minutes. This is the tool for the days between
            practice exams &mdash; short enough that you will actually do it, specific enough that it fixes
            something you can name.</p>
    </div>
    <div id="list"></div>
    <div id="app"></div>
</div></main>

<footer id="footer"></footer>

<script src="assets/data/drills.js"></script>
<script src="assets/data/drills-c2.js"></script>
<script src="assets/test-engine.js"></script>
<script>
(function () {
    function param(k) {
        var m = new RegExp("[?&]" + k + "=([^&]*)").exec(window.location.search);
        return m ? decodeURIComponent(m[1]) : null;
    }

    var DOMAIN_META = {
        "Hardware and Network Troubleshooting":
            { icon: "bad",   blurb: "28% of Core 1 \u2014 the largest domain on the exam, and the one that only improves by doing questions." },
        "Hardware":
            { icon: "amber", blurb: "25% of Core 1. Almost pure recall, which makes it the fastest domain to raise." },
        "Networking":
            { icon: "teal",  blurb: "23% of Core 1. Four tables carry most of it: ports, cable limits, Wi-Fi standards, and tools." },
        "Mobile Devices":
            { icon: "good",  blurb: "13% of Core 1. Vocabulary and part-to-symptom mapping." },
        "Virtualization and Cloud Computing":
            { icon: "good",  blurb: "11% of Core 1. The smallest domain and the most memorizable \u2014 do not leave these points on the table." },
        "Operating Systems":
            { icon: "bad",   blurb: "28% of Core 2. Windows editions, tools, file systems, and the command line." },
        "Security":
            { icon: "bad",   blurb: "28% of Core 2. Malware, social engineering, permissions, and hardening." },
        "Software Troubleshooting":
            { icon: "amber", blurb: "23% of Core 2. Windows and mobile symptoms mapped to the right fix." },
        "Operational Procedures":
            { icon: "teal",  blurb: "21% of Core 2. Documentation, change management, backups, safety, and professionalism. The cheapest points on the exam." }
    };

    var DOMAIN_ORDER = {
        "Core 1": ["Hardware and Network Troubleshooting", "Hardware", "Networking",
                   "Mobile Devices", "Virtualization and Cloud Computing"],
        "Core 2": ["Operating Systems", "Security", "Software Troubleshooting", "Operational Procedures"]
    };

    function bestFor(id) {
        var runs = AP.store.get("drillScores", {});
        return runs[id] || null;
    }

    function renderGroup(sets, coreLabel, isActive) {
        var order = DOMAIN_ORDER[coreLabel];
        var html = "", count = 0, questions = 0;
        var body = "";

        for (var o = 0; o < order.length; o++) {
            var domain = order[o];
            var group = [];
            for (var s = 0; s < sets.length; s++) {
                if (sets[s].core === coreLabel && sets[s].domain === domain) group.push(sets[s]);
            }
            if (!group.length) continue;

            var meta = DOMAIN_META[domain] || { icon: "", blurb: "" };
            body += '<div class="week-head"><h2>' + domain + "</h2>" +
                '<span class="wgoal">' + meta.blurb + "</span></div>" +
                '<div class="grid grid-3">';

            for (var g = 0; g < group.length; g++) {
                var d = group[g];
                var qn = d.questions.length;
                count++; questions += qn;
                var prev = bestFor(d.id);
                var badge = prev
                    ? '<span class="badge ' + (prev.pct >= 85 ? "good" : (prev.pct >= 60 ? "amber" : "bad")) +
                      '">Best ' + prev.right + "/" + prev.total + "</span>"
                    : "";
                body += '<a class="card card-link" href="drills.html?set=' + d.id + '">' +
                    '<div class="card-icon ' + meta.icon + '">' + qn + "</div>" +
                    "<h3>" + d.title + " " + badge + "</h3>" +
                    "<p>" + (d.blurb || "") + "</p>" +
                    '<p class="faint" style="margin-bottom:0"><small>' + qn + " questions &middot; " +
                    (d.timeMinutes || 10) + " minutes</small></p></a>";
            }
            body += "</div>";
        }

        if (!count) return "";

        var code = coreLabel === "Core 1" ? "220-1101" : "220-1102";
        html += '<h2 style="margin-top:' + (isActive ? "1.4rem" : "2.6rem") + '">' + coreLabel +
            ' <span class="badge ' + (isActive ? "accent" : "") + '">' + code +
            (isActive ? " &middot; the exam you are studying" : " &middot; the other exam") + "</span></h2>" +
            '<p class="muted" style="margin-top:-.4rem">' + count + " sets &middot; " + questions +
            " questions.</p>" + body;
        return html;
    }

    document.addEventListener("DOMContentLoaded", function () {
        var sets = (window.AP_DATA && window.AP_DATA.drills) || [];
        var want = param("set");

        if (want) {
            var found = null;
            for (var i = 0; i < sets.length; i++) if (sets[i].id === want) found = sets[i];
            if (found) {
                document.getElementById("head").innerHTML =
                    '<p class="no-print"><a href="drills.html">&larr; All drills</a></p>' +
                    "<h1>" + found.title + "</h1>" +
                    '<p class="lede">' + (found.blurb || "") + "</p>";
                document.getElementById("list").innerHTML = "";
                AP.Test.mountDrill({ el: document.getElementById("app"), drillId: want });
                return;
            }
            AP.toast("That drill was not found.");
        }

        var track = AP.track();
        var activeLabel = track === "core2" ? "Core 2" : "Core 1";
        var otherLabel = track === "core2" ? "Core 1" : "Core 2";

        var html = renderGroup(sets, activeLabel, true) + renderGroup(sets, otherLabel, false);

        if (!html) {
            html = '<div class="card"><h3>Drills did not load</h3>' +
                "<p>The drill data files could not be read. Refresh the page; if it keeps happening a file is missing.</p></div>";
        } else {
            var totalQ = 0;
            for (var q = 0; q < sets.length; q++) totalQ += sets[q].questions.length;
            html = '<div class="callout tip"><span class="callout-title">How to use a drill</span>' +
                "<p>Do the whole set on the clock without checking anything. Then read the explanation for " +
                "<em>every</em> question, including the ones you got right \u2014 if you guessed correctly, you " +
                "have not learned it yet, you have just been lucky once.</p>" +
                '<p style="margin-bottom:0">Anything you miss goes in the <a href="tools.html#errorlog">error log</a>, ' +
                "and you re-drill that set two days later. A repeated drill is worth more than a new one, " +
                "especially in the last three days.</p></div>" +
                '<p class="muted">' + sets.length + " drill sets &middot; " + totalQ +
                " questions across both exams. Your current exam is listed first.</p>" + html;
        }
        document.getElementById("list").innerHTML = html;
    });
})();
</script>
</body>
</html>
